[project]
name = "reproducible-ai-core"
version = "0.1.0"
description = "Trace format, hashing, seed derivation and resume tokens for bitwise-deterministic LLM inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "blake3>=1.0",
  "pynacl>=1.5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproducible_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
